[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-trn"
version = "0.1.0"
description = "Validated baseline for lunar map-relative terrain-relative navigation (LVS-style)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=2.0,<2.3",
    "scipy>=1.13,<1.16",
    "opencv-python-headless>=4.10",
    "rasterio>=1.3,<1.5",
    "OpenEXR>=3.3,<3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: test needs local datasets under data/ (skipped when absent)",
    "slow: end-to-end tests that take tens of seconds",
]
